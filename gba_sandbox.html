<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: black; overflow: hidden; display: flex; flex-direction: column; }
        #emulator-container { width: 100% !important; height: 100% !important; flex-grow: 1; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; width: 100% !important; height: 100% !important; image-rendering: pixelated; }
        
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('Emulators/gba/cover.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            box-sizing: border-box; padding-bottom: 50px; z-index: 100; display: none; 
        }

        #start-btn { 
            background: rgba(0, 0, 0, 0.6); 
            border: 2px solid #00ff41; 
            color: #00ff41; 
            padding: 15px 40px; 
            font-size: 1.5rem; 
            cursor: pointer; 
            text-transform: uppercase; 
            box-shadow: 0 0 15px #00ff41; 
            border-radius: 50px;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
            font-family: inherit;
        }

        #start-btn:hover {
            background: #00ff41;
            color: black;
            box-shadow: 0 0 30px #00ff41;
        }
    </style>
</head>
<body>
    <div id="emulator-container"></div>
    <div id="start-overlay"><button id="start-btn">ESTABLISH UPLINK</button></div>

    <script>
        // Audio Interception Logic to enable Muting
        (function() {
            const originalConnect = AudioNode.prototype.connect;
            AudioNode.prototype.connect = function(destination, output, input) {
                if (destination && destination instanceof AudioDestinationNode) {
                    const ctx = destination.context;
                    if (!ctx._masterGain) {
                        ctx._masterGain = ctx.createGain();
                        ctx._masterGain.gain.value = 1.0; 
                        originalConnect.call(ctx._masterGain, destination);
                        window.emulatorAudioContext = ctx;
                    }
                    return originalConnect.call(this, ctx._masterGain, output, input);
                }
                return originalConnect.apply(this, arguments);
            };
        })();
    </script>

    <script src="Emulators/gba/nostalgist.umd.min.js"></script>

    <script>
        let emulatorInstance = null;
        let pendingConfig = null;
        let gamepadLoop = null;

        function pollGamepads() {
            gamepadLoop = requestAnimationFrame(pollGamepads);
            const gamepads = navigator.getGamepads();
            for (const gp of gamepads) {
                if (!gp) continue;
                
                const r1 = gp.buttons[5].pressed; 
                const xBtn = gp.buttons[2].pressed; 
                const yBtn = gp.buttons[3].pressed;

                if (r1 && yBtn) window.parent.postMessage({ status: 'gamepad_save' }, '*');
                if (r1 && xBtn) window.parent.postMessage({ status: 'gamepad_load' }, '*');
            }
        }

        async function launchEmulator() {
            if (!pendingConfig) return;
            const container = document.getElementById('emulator-container');
            const overlay = document.getElementById('start-overlay');
            try {
                if (window.emulatorAudioContext && window.emulatorAudioContext.state === 'suspended') {
                    await window.emulatorAudioContext.resume();
                } else if (window.AudioContext) {
                    new window.AudioContext().resume();
                }

                overlay.style.display = 'none';
                container.innerHTML = '';
                const canvas = document.createElement('canvas');
                container.appendChild(canvas);

                const finalRetroarchConfig = {
                    // Aspect Ratio Fix: Allow core to decide based on ROM type
                    video_aspect_ratio_auto: true, 
                    ...pendingConfig.retroarchConfig,
                    // Xbox Controller Physical Layout Fix
                    input_player1_a_btn: "0", 
                    input_player1_b_btn: "1",
                    // Analog Stick Sensitivity Adjustments
                    input_player1_analog_dpad_mode: 1,
                    input_analog_deadzone: 0.05,
                    input_axis_threshold: 0.3
                };

                emulatorInstance = await Nostalgist.launch({
                    element: canvas, 
                    rom: pendingConfig.romBlob,
                    core: 'mgba',
                    resolveCoreJs(core) { return `Emulators/gba/${core}_libretro.js`; },
                    resolveCoreWasm(core) { return `Emulators/gba/${core}_libretro.wasm`; },
                    retroarchConfig: finalRetroarchConfig,
                    style: { width: '100%', height: '100%', display: 'block' }
                });
                
                window.focus();
                window.parent.postMessage({ status: 'running' }, '*');
                if (!gamepadLoop) pollGamepads();

            } catch (e) { window.parent.postMessage({ status: 'error', message: e.toString() }, '*'); }
        }

        window.addEventListener('message', async (event) => {
            const { command, stateData, slot } = event.data;
            if (command === 'start') {
                pendingConfig = event.data;
                document.getElementById('start-overlay').style.display = 'flex';
            } 
            else if (command === 'mute') {
                const ctx = window.emulatorAudioContext;
                if (ctx && ctx._masterGain) {
                    const isMuted = ctx._masterGain.gain.value < 0.01;
                    ctx._masterGain.gain.setTargetAtTime(isMuted ? 1.0 : 0.0, ctx.currentTime, 0.1);
                }
            }
            else if (command === 'save_state') {
                if (!emulatorInstance) return;
                const numericSlot = slot ? (parseInt(slot) - 1) : 0;
                try {
                    const { state } = await emulatorInstance.saveState(numericSlot);
                    const reader = new FileReader();
                    reader.onloadend = () => window.parent.postMessage({ status: 'save_success', data: reader.result }, '*');
                    reader.readAsDataURL(state);
                } catch (e) { console.error("Internal Save Error:", e); }
            } 
            else if (command === 'load_state') {
                if (!emulatorInstance || !stateData) return;
                const response = await fetch(stateData);
                const blob = await response.blob();
                await emulatorInstance.loadState(blob);
                window.parent.postMessage({ status: 'load_complete' }, '*');
            }
        });

        document.getElementById('start-btn').addEventListener('click', launchEmulator);
    </script>
</body>
</html>
