<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: black; overflow: hidden;
            display: flex;
            flex-direction: column; 
        }
        #emulator-container { 
            width: 100% !important; height: 100% !important; 
            flex-grow: 1;
            display: flex; justify-content: center; align-items: center; 
        }
        canvas { 
            display: block; 
            width: 100% !important; 
            height: 100% !important; 
            image-rendering: pixelated; 
        }

        /* START OVERLAY RESTORED */
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            /* CHANGED: Removed linear-gradient overlay so image is not dimmed */
            background: url('Emulators/snes/cover.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            display: flex; flex-direction: column;
            justify-content: flex-end; /* Push to bottom */
            align-items: center;
            
            /* CRITICAL FIX: Ensures padding is calculated INSIDE the 100% height */
            box-sizing: border-box; 
            padding-bottom: 50px; /* This creates the gap from the bottom green frame */
            
            z-index: 100;
            display: none; 
        }
        #start-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ff41;
            color: #00ff41;
            padding: 15px 40px;
            font-size: 1.5rem;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            box-shadow: 0 0 15px #00ff41;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
            border-radius: 50px; /* Pill shape */
        }
        #start-btn:hover {
            background: #00ff41;
            color: black;
            box-shadow: 0 0 30px #00ff41;
        }
    </style>
</head>
<body>
    <div id="emulator-container"></div>
    
    <div id="start-overlay">
        <button id="start-btn">ESTABLISH UPLINK</button>
    </div>

    <script>
        (function() {
            const originalConnect = AudioNode.prototype.connect;
            AudioNode.prototype.connect = function(destination, output, input) {
                if (destination && destination instanceof AudioDestinationNode) {
                    const ctx = destination.context;
                    if (!ctx._masterGain) {
                        ctx._masterGain = ctx.createGain();
                        ctx._masterGain.gain.value = 1.0; 
                        originalConnect.call(ctx._masterGain, destination);
                        window.emulatorAudioContext = ctx;
                    }
                    return originalConnect.call(this, ctx._masterGain, output, input);
                }
                return originalConnect.apply(this, arguments);
            };
        })();
    </script>

    <script src="Emulators/genesis/nostalgist.umd.min.js"></script>

    <script>
        let emulatorInstance = null;
        let gamepadLoop = null;
        let pendingConfig = null; // To hold data until button click

        function pollGamepads() {
            gamepadLoop = requestAnimationFrame(pollGamepads);
            const gamepads = navigator.getGamepads();
        }

        async function launchEmulator() {
            if (!pendingConfig) return;
            const container = document.getElementById('emulator-container');
            const overlay = document.getElementById('start-overlay');

            try {
                // Initialize Audio Context on User Gesture
                if (window.emulatorAudioContext && window.emulatorAudioContext.state === 'suspended') {
                    await window.emulatorAudioContext.resume();
                } else if (window.AudioContext) {
                    new window.AudioContext().resume();
                }

                overlay.style.display = 'none';
                container.innerHTML = '';
                const canvas = document.createElement('canvas');
                container.appendChild(canvas);

                emulatorInstance = await Nostalgist.launch({
                    element: canvas, 
                    rom: pendingConfig.romBlob,
                    core: pendingConfig.coreConfig,
                    retroarchConfig: pendingConfig.retroarchConfig,
                    // FORCE FULL SIZE
                    style: { width: '100%', height: '100%', display: 'block' }
                });
                
                window.focus();
                window.parent.postMessage({ status: 'running' }, '*');
                
                if (!gamepadLoop) pollGamepads();

            } catch (e) {
                console.error("Sandbox Error:", e);
                window.parent.postMessage({ status: 'error', message: e.toString() }, '*');
            }
        }

        window.addEventListener('message', (event) => {
            const { command } = event.data;

            if (command === 'start') {
                // DON'T LAUNCH YET - Show Overlay
                pendingConfig = event.data;
                document.getElementById('start-overlay').style.display = 'flex';
            }
            else if (command === 'mute') {
                const ctx = window.emulatorAudioContext;
                if (ctx && ctx._masterGain) {
                    const isMuted = ctx._masterGain.gain.value < 0.01;
                    ctx._masterGain.gain.setTargetAtTime(isMuted ? 1.0 : 0.0, ctx.currentTime, 0.1);
                }
            }
        });

        window.addEventListener("gamepadconnected", (e) => {
            window.parent.postMessage({ status: 'gamepad_connected', id: e.gamepad.id }, '*');
        });

        // RESTORED BUTTON LISTENER
        document.getElementById('start-btn').addEventListener('click', launchEmulator);
    </script>
</body>
</html>
