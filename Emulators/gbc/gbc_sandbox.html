<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: black; overflow: hidden; display: flex; flex-direction: column; }
        #emulator-container { width: 100% !important; height: 100% !important; flex-grow: 1; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; width: 100% !important; height: 100% !important; image-rendering: pixelated; outline: none; }
        
        #notification {
            position: absolute;
            top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); border: 1px solid #00ff41; color: #00ff41;
            padding: 10px 20px; font-family: 'Courier New', monospace; font-weight: bold;
            font-size: 16px; border-radius: 5px; display: none; z-index: 1000; pointer-events: none;
        }

        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('cover.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            box-sizing: border-box; padding-bottom: 50px; z-index: 100; display: none; 
        }

        #start-btn { 
            background: black; 
            border: 2px solid #00ff41; 
            color: #00ff41; 
            padding: 15px 40px; 
            font-size: 1.5rem; 
            cursor: pointer; 
            text-transform: uppercase; 
            box-shadow: 0 0 15px #00ff41; 
            border-radius: 50px;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
            font-family: inherit;
        }

        #start-btn:hover {
            background: #00ff41;
            color: black;
            box-shadow: 0 0 30px #00ff41;
        }
    </style>
</head>
<body>
    <div id="notification"></div>
    <div id="emulator-container"></div>
    <div id="start-overlay"><button id="start-btn">BOOT SYSTEM</button></div>

    <script>
        (function() {
            const originalConnect = AudioNode.prototype.connect;
            AudioNode.prototype.connect = function(destination, output, input) {
                if (destination && destination instanceof AudioDestinationNode) {
                    const ctx = destination.context;
                    if (!ctx._masterGain) {
                        ctx._masterGain = ctx.createGain();
                        ctx._masterGain.gain.value = 1.0; 
                        originalConnect.call(ctx._masterGain, destination);
                        window.emulatorAudioContext = ctx;
                    }
                    return originalConnect.call(this, ctx._masterGain, output, input);
                }
                return originalConnect.apply(this, arguments);
            };
        })();
    </script>

    <script src="../gba/nostalgist.umd.min.js"></script>

    <script>
        let emulatorInstance = null;
        let pendingConfig = null;
        let isLaunching = false;
        
        let currentSaveBlob = null; 
        let currentSlot = 1; 
        
        const INTERNAL_ROM_NAME = "game.gbc";

        function showNotification(text) {
            const el = document.getElementById('notification');
            if(el) {
                el.innerText = text;
                el.style.display = 'block';
                if(el.hideTimeout) clearTimeout(el.hideTimeout);
                el.hideTimeout = setTimeout(() => { el.style.display = 'none'; }, 2000);
            }
        }

        window.addEventListener('keydown', async (e) => {
            if (!emulatorInstance) return;

            if (e.key === '1' || e.code === 'Digit1') {
                e.preventDefault(); 
                e.stopPropagation();
                try {
                    showNotification(`SAVING SLOT ${currentSlot}...`);
                    const stateResult = await emulatorInstance.saveState();
                    let blob = (stateResult && stateResult.state) ? stateResult.state : stateResult;
                    currentSaveBlob = blob;
                    const buffer = await blob.arrayBuffer();
                    window.parent.postMessage({ 
                        command: 'export_state', 
                        slot: currentSlot,
                        romName: pendingConfig.romName, 
                        data: buffer 
                    }, '*');
                    showNotification(`SAVED SLOT ${currentSlot}`);
                } catch(err) { 
                    showNotification("SAVE ERROR"); 
                }
            }

            if (e.key === '4' || e.code === 'Digit4') {
                e.preventDefault(); 
                e.stopPropagation();
                if (currentSaveBlob) {
                    try {
                        showNotification(`LOADING SLOT ${currentSlot}...`);
                        await emulatorInstance.loadState(currentSaveBlob);
                        showNotification("STATE LOADED");
                    } catch(err) { 
                        showNotification("LOAD ERROR"); 
                    }
                } else { 
                    showNotification(`SLOT ${currentSlot} EMPTY`); 
                }
            }
        }, true); 

        async function launchEmulator() {
            if (isLaunching || !pendingConfig || !pendingConfig.romBlob) return;
            isLaunching = true;

            const container = document.getElementById('emulator-container');
            const overlay = document.getElementById('start-overlay');
            
            try {
                if (window.emulatorAudioContext && window.emulatorAudioContext.state === 'suspended') {
                    await window.emulatorAudioContext.resume();
                } else if (window.AudioContext) {
                    new window.AudioContext().resume();
                }

                overlay.style.display = 'none';
                container.innerHTML = '';
                
                const canvas = document.createElement('canvas');
                canvas.tabIndex = 0; 
                container.appendChild(canvas);
                canvas.focus();

                const romToLoad = new File([pendingConfig.romBlob], INTERNAL_ROM_NAME);

                if (pendingConfig.initialState) {
                    currentSaveBlob = pendingConfig.initialState instanceof Blob ? 
                        pendingConfig.initialState : new Blob([pendingConfig.initialState]);
                }
                
                if (pendingConfig.initialSlot) {
                    currentSlot = pendingConfig.initialSlot;
                }

                const finalRetroarchConfig = {
                    video_aspect_ratio_auto: true, 
                    notification_show_osd_messages: "true",
                    savestate_auto_index: false,
                    savestate_auto_save: false,
                    savestate_auto_load: false,
                    // Map Gamepad A to RetroArch A (0) and Gamepad B to RetroArch B (1)
                    input_player1_a_btn: 0,
                    input_player1_b_btn: 1,
                    ...pendingConfig.retroarchConfig
                };

                emulatorInstance = await Nostalgist.launch({
                    element: canvas, 
                    rom: romToLoad,
                    core: 'gambatte',
                    resolveCoreJs(core) { return `./${core}_libretro.js`; },
                    resolveCoreWasm(core) { return `./${core}_libretro.wasm`; },
                    retroarchConfig: finalRetroarchConfig,
                    style: { width: '100%', height: '100%', display: 'block' }
                });
                
                startGamepadPolling();
                window.focus();
                canvas.focus();
                window.parent.postMessage({ status: 'running' }, '*');

            } catch (e) { 
                console.error("Launch Error:", e);
                window.parent.postMessage({ status: 'error', message: e.toString() }, '*'); 
                isLaunching = false;
            }
        }

        window.addEventListener('message', async (event) => {
            const { command } = event.data;
            if (command === 'start') {
                pendingConfig = event.data;
                document.getElementById('start-overlay').style.display = 'flex';
                // Start polling immediately so gamepad can trigger the boot button
                startGamepadPolling();
            }
            else if (command === 'import_slot' || command === 'import_state') {
                if (event.data.slot !== undefined) currentSlot = event.data.slot;
                if (event.data.blob || event.data.data) {
                    currentSaveBlob = new Blob([event.data.blob || event.data.data]);
                    showNotification(`SLOT ${currentSlot} READY`);
                } else {
                    currentSaveBlob = null;
                    showNotification(`SLOT ${currentSlot} EMPTY`);
                }
            }
            else if (command === 'mute') {
                const ctx = window.emulatorAudioContext;
                if (ctx && ctx._masterGain) {
                    const isMuted = ctx._masterGain.gain.value < 0.01;
                    ctx._masterGain.gain.setTargetAtTime(isMuted ? 1.0 : 0.0, ctx.currentTime, 0.1);
                }
            }
        });

        window.addEventListener('click', () => {
             const canvas = document.querySelector('canvas');
             if(canvas) canvas.focus();
        });

        document.getElementById('start-btn').addEventListener('click', launchEmulator);

        // ==========================================
        //       FIXED GAMEPAD SUPPORT
        // ==========================================
        
        let gamepadPollInterval = null;
        const BUTTON_MAP = {
            0: 'z',          // Xbox A -> GBC A
            1: 'x',          // Xbox B -> GBC B
            2: 'z',          // Xbox X -> GBC A
            3: 'x',          // Xbox Y -> GBC B
            4: 'q',          // LB
            5: 'e',          // RB
            8: 'shift',      // Select
            9: 'enter',      // Start
            12: 'up',        // D-Pad Up
            13: 'down',      // D-Pad Down
            14: 'left',      // D-Pad Left
            15: 'right'      // D-Pad Right
        };

        const gamepadState = {};

        function triggerKey(key, type) {
            const canvas = document.querySelector('canvas');
            if (!canvas) return;

            const keyEvent = new KeyboardEvent(type, {
                key: key,
                code: key === 'z' ? 'KeyZ' : 
                      key === 'x' ? 'KeyX' : 
                      key === 'enter' ? 'Enter' : 
                      key === 'shift' ? 'ShiftRight' : 
                      key === 'up' ? 'ArrowUp' :
                      key === 'down' ? 'ArrowDown' :
                      key === 'left' ? 'ArrowLeft' :
                      key === 'right' ? 'ArrowRight' :
                      `Key${key.toUpperCase()}`,
                bubbles: true,
                cancelable: true
            });
            canvas.dispatchEvent(keyEvent);
            window.dispatchEvent(keyEvent);
        }

        function pollGamepads() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const overlay = document.getElementById('start-overlay');
            const isOverlayVisible = overlay && overlay.style.display === 'flex';

            for (let i = 0; i < gamepads.length; i++) {
                const gp = gamepads[i];
                if (!gp) continue;

                // BOOT TRIGGER: If overlay is active and A button (0) is pressed
                if (isOverlayVisible) {
                    if (gp.buttons[0] && gp.buttons[0].pressed) {
                        launchEmulator();
                        return; // Exit processing for this tick
                    }
                    continue; // Skip normal button mapping while overlay is visible
                }

                for (let btnIdx in BUTTON_MAP) {
                    const key = BUTTON_MAP[btnIdx];
                    const isPressed = gp.buttons[btnIdx] && gp.buttons[btnIdx].pressed;
                    const stateKey = `gp_${i}_btn_${btnIdx}`;

                    if (isPressed && !gamepadState[stateKey]) {
                        gamepadState[stateKey] = true;
                        triggerKey(key, 'keydown');
                    } else if (!isPressed && gamepadState[stateKey]) {
                        gamepadState[stateKey] = false;
                        triggerKey(key, 'keyup');
                    }
                }

                const threshold = 0.5;
                const axisX = gp.axes[0];
                const leftKey = `gp_${i}_axis_left`;
                const rightKey = `gp_${i}_axis_right`;

                if (axisX < -threshold) { 
                    if (!gamepadState[leftKey]) { triggerKey('left', 'keydown'); gamepadState[leftKey] = true; }
                } else if (gamepadState[leftKey]) { triggerKey('left', 'keyup'); gamepadState[leftKey] = false; }

                if (axisX > threshold) { 
                    if (!gamepadState[rightKey]) { triggerKey('right', 'keydown'); gamepadState[rightKey] = true; }
                } else if (gamepadState[rightKey]) { triggerKey('right', 'keyup'); gamepadState[rightKey] = false; }

                const axisY = gp.axes[1];
                const upKey = `gp_${i}_axis_up`;
                const downKey = `gp_${i}_axis_down`;

                if (axisY < -threshold) { 
                    if (!gamepadState[upKey]) { triggerKey('up', 'keydown'); gamepadState[upKey] = true; }
                } else if (gamepadState[upKey]) { triggerKey('up', 'keyup'); gamepadState[upKey] = false; }

                if (axisY > threshold) { 
                    if (!gamepadState[downKey]) { triggerKey('down', 'keydown'); gamepadState[downKey] = true; }
                } else if (gamepadState[downKey]) { triggerKey('down', 'keyup'); gamepadState[downKey] = false; }
            }
        }

        function startGamepadPolling() {
            if (gamepadPollInterval) return;
            gamepadPollInterval = setInterval(pollGamepads, 16);
        }

        window.addEventListener("gamepadconnected", (e) => {
            showNotification("GAMEPAD CONNECTED");
            startGamepadPolling();
        });

        window.addEventListener("gamepaddisconnected", (e) => {
            showNotification("CONTROLLER DISCONNECTED");
        });
    </script>
</body>
</html>
