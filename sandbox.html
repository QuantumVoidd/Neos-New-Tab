<!DOCTYPE html>
<html>
<head>
    <script>
        // --- ZION SANDBOX ENGINE ---
        window.addEventListener('message', async (event) => {
            const { code, taskId } = event.data;
            if (taskId !== 'operator-exec') return;

            try {
                // Wrap code in an IIFE so 'return' statements are legal
                const wrappedCode = `(function() { 
                    try {
                        ${code} 
                    } catch (e) {
                        return "RUNTIME_ERROR: " + e.message;
                    }
                })()`;
                
                const result = eval(wrappedCode);
                
                // Send signal back to Zion Mainframe
                event.source.postMessage({ 
                    taskId, 
                    result: result !== undefined ? result : "VOID", 
                    success: true 
                }, event.origin);
            } catch (err) {
                event.source.postMessage({ 
                    taskId, 
                    error: err.message, 
                    success: false 
                }, event.origin);
            }
        });
    </script>
</head>
<body></body>
</html>
