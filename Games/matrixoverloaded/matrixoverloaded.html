<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Matrix Overloaded</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #ruffle-container { width: 100%; height: 100%; }
        ruffle-player { width: 100% !important; height: 100% !important; display: block !important; outline: none; }
        #notification { 
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
            background: rgba(0, 0, 0, 0.9); border: 1px solid #00ff41; color: #00ff41; 
            padding: 10px 20px; font-family: 'Courier New', monospace; z-index: 1000; 
            display: none; pointer-events: none; border-radius: 5px; font-weight: bold;
        }
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: black;
            background-image: url('cover.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            box-sizing: border-box; padding-bottom: 50px; z-index: 100;
        }
        #start-btn { 
            background: rgba(0, 0, 0, 0.6); border: 2px solid #00ff41; color: #00ff41; 
            padding: 15px 40px; font-size: 1.5rem; cursor: pointer; text-transform: uppercase; 
            box-shadow: 0 0 15px #00ff41; border-radius: 50px; transition: all 0.2s;
            backdrop-filter: blur(4px); font-family: inherit;
        }
        #start-btn:hover { background: #00ff41; color: black; box-shadow: 0 0 30px #00ff41; }
    </style>
    <script src="../../Ruffle/ruffle.js"></script>
</head>
<body>
    <div id="notification"></div>
    <div id="ruffle-container"></div>
    <div id="start-overlay"><button id="start-btn"> PLAY </button></div>
    <script src="matrixoverloaded_launcher.js"></script>
</body>
</html>
