<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: black; overflow: hidden; 
        }
        #emulator-container { 
            width: 100%; height: 100%; 
            display: flex; justify-content: center; align-items: center; 
        }
        canvas { 
            display: block; width: 100%; height: 100%; image-rendering: pixelated; 
        }
    </style>
</head>
<body>
    <div id="emulator-container"></div>

    <script>
        // Audio Context Patch - Prevents auto-suspend
        (function() {
            const originalConnect = AudioNode.prototype.connect;
            AudioNode.prototype.connect = function(destination, output, input) {
                if (destination && destination instanceof AudioDestinationNode) {
                    const ctx = destination.context;
                    if (!ctx._masterGain) {
                        ctx._masterGain = ctx.createGain();
                        ctx._masterGain.gain.value = 1.0; 
                        originalConnect.call(ctx._masterGain, destination);
                        window.emulatorAudioContext = ctx;
                    }
                    return originalConnect.call(this, ctx._masterGain, output, input);
                }
                return originalConnect.apply(this, arguments);
            };
        })();
    </script>

    <script src="Emulators/genesis/nostalgist.umd.min.js"></script>

    <script>
        let emulatorInstance = null;
        let gamepadLoop = null;
        
        // Processing Lock to prevent overlapping operations
        let isProcessing = false;

        const blobToBase64 = blob => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });

        async function base64ToBlob(base64) {
            const res = await fetch(base64);
            return await res.blob();
        }

        // --- KEYBOARD HOTKEYS (1, 4) ---
        window.addEventListener('keydown', (e) => {
            if (e.key === '1') saveState();
            if (e.key === '4') window.parent.postMessage({ status: 'request_load' }, '*');
        });

        function pollGamepads() {
            gamepadLoop = requestAnimationFrame(pollGamepads);
            const gamepads = navigator.getGamepads();
            const gp = gamepads[0];
            if (!gp) return;

            // R1 + A = SAVE
            if (gp.buttons[5]?.pressed && gp.buttons[0]?.pressed) {
                if (!isProcessing) saveState();
            } 

            // R1 + X = LOAD
            if (gp.buttons[5]?.pressed && gp.buttons[2]?.pressed) {
                if (!isProcessing) {
                    isProcessing = true; // Lock immediately
                    window.parent.postMessage({ status: 'request_load' }, '*');
                    // Unlock after a delay to prevent spam
                    setTimeout(() => isProcessing = false, 1000); 
                }
            }
        }

        async function saveState() {
            if (!emulatorInstance || isProcessing) return;
            isProcessing = true;
            
            try {
                const result = await emulatorInstance.saveState();
                
                let blob = result;
                if (result && result.state) blob = result.state;
                
                // Force Binary Type
                const cleanBlob = new Blob([blob], { type: 'application/octet-stream' });
                const stateStr = await blobToBase64(cleanBlob);
                
                window.parent.postMessage({ status: 'save_success', data: stateStr }, '*');
            } catch (e) {
                console.error("Save Error:", e);
                window.parent.postMessage({ status: 'error', message: "Save Failed: " + e.message }, '*');
            } finally {
                isProcessing = false;
            }
        }

        window.addEventListener('message', async (event) => {
            const { command, romBlob, coreConfig, stateData } = event.data;

            if (command === 'start') {
                const container = document.getElementById('emulator-container');
                try {
                    container.innerHTML = '';
                    const canvas = document.createElement('canvas');
                    canvas.id = 'game-canvas';
                    container.appendChild(canvas);

                    const inputConfig = {
                        input_player1_up: "w", input_player1_down: "s",
                        input_player1_left: "a", input_player1_right: "d",
                        input_player1_start: "rshift", input_player1_select: "capslock",
                        input_player1_y: "space", input_player1_b: "lshift",
                        input_player1_a: "i", input_player1_l: "k",
                        input_player1_x: "j", input_player1_r: "l",
                        input_toggle_fast_forward: "p"
                    };

                    emulatorInstance = await Nostalgist.launch({
                        element: canvas, 
                        rom: romBlob,
                        core: coreConfig,
                        retroarchConfig: inputConfig,
                        style: { width: '100%', height: '100%' }
                    });
                    
                    window.focus();
                    window.parent.postMessage({ status: 'running' }, '*');
                    if (!gamepadLoop) pollGamepads();

                } catch (e) {
                    console.error("Sandbox Error:", e);
                    window.parent.postMessage({ status: 'error', message: e.toString() }, '*');
                }
            }
            else if (command === 'mute') {
                const ctx = window.emulatorAudioContext;
                if (ctx && ctx._masterGain) {
                    const isMuted = ctx._masterGain.gain.value < 0.01;
                    ctx._masterGain.gain.setTargetAtTime(isMuted ? 1.0 : 0.0, ctx.currentTime, 0.1);
                }
            }
            else if (command === 'load_state') {
                if (emulatorInstance && stateData) {
                    isProcessing = true;
                    try {
                        const rawBlob = await base64ToBlob(stateData);
                        const blob = new Blob([rawBlob], { type: 'application/octet-stream' });

                        // --- AUDIO-SANDWICH LOAD STRATEGY ---
                        // 1. Suspend Audio (Stops the clock)
                        if (window.emulatorAudioContext) {
                            await window.emulatorAudioContext.suspend();
                        }

                        // 2. Load the state while clock is stopped
                        await emulatorInstance.loadState(blob);

                        // 3. Resume Audio (Resyncs the clock)
                        if (window.emulatorAudioContext) {
                            await window.emulatorAudioContext.resume();
                        }

                        // 4. Force Focus & Resume Emulator Loop
                        window.focus();
                        await emulatorInstance.resume();

                        window.parent.postMessage({ status: 'load_complete' }, '*');

                    } catch (e) {
                        console.error("Load Error:", e);
                        window.parent.postMessage({ status: 'error', message: "Load Failed" }, '*');
                    } finally {
                        isProcessing = false;
                    }
                }
            }
        });

        window.addEventListener("gamepadconnected", (e) => {
            window.parent.postMessage({ status: 'gamepad_connected', id: e.gamepad.id }, '*');
        });
    </script>
</body>
</html>
