<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: black; overflow: hidden; display: flex; flex-direction: column; }
        #emulator-container { width: 100% !important; height: 100% !important; flex-grow: 1; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; width: 100% !important; height: 100% !important; image-rendering: pixelated; outline: none; }
        
        #notification {
            position: absolute;
            top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); border: 1px solid #00ff41; color: #00ff41;
            padding: 10px 20px; font-family: 'Courier New', monospace; font-weight: bold;
            font-size: 16px; border-radius: 5px; display: none; z-index: 1000; pointer-events: none;
        }

        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('Emulators/nes/cover.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            box-sizing: border-box; padding-bottom: 50px; z-index: 100; display: none; 
        }

        #start-btn { 
            background: rgba(0, 0, 0, 0.6); border: 2px solid #00ff41; color: #00ff41; 
            padding: 15px 40px; font-size: 1.5rem; cursor: pointer; text-transform: uppercase; 
            box-shadow: 0 0 15px #00ff41; border-radius: 50px; transition: all 0.2s;
            backdrop-filter: blur(4px); font-family: inherit;
        }

        #start-btn:hover { background: #00ff41; color: black; box-shadow: 0 0 30px #00ff41; }
    </style>
</head>
<body>
    <div id="notification"></div>
    <div id="emulator-container"></div>
    <div id="start-overlay"><button id="start-btn">BOOT SYSTEM</button></div>

    <script>
        // --- Wake Lock Stub ---
        if ('wakeLock' in navigator) {
            Object.defineProperty(navigator.wakeLock, 'request', {
                value: async () => ({ addEventListener: () => {}, release: async () => {}, released: false }),
                writable: false
            });
        }

        // --- Audio Context Stub ---
        (function() {
            const originalConnect = AudioNode.prototype.connect;
            AudioNode.prototype.connect = function(destination, output, input) {
                if (destination && destination instanceof AudioDestinationNode) {
                    const ctx = destination.context;
                    if (!ctx._masterGain) {
                        ctx._masterGain = ctx.createGain();
                        ctx._masterGain.gain.value = 1.0; 
                        originalConnect.call(ctx._masterGain, destination);
                        window.emulatorAudioContext = ctx;
                    }
                    return originalConnect.call(this, ctx._masterGain, output, input);
                }
                return originalConnect.apply(this, arguments);
            };
        })();
    </script>

    <script src="Emulators/nes/nostalgist.umd.min.js"></script>

    <script>
        let emulatorInstance = null;
        let pendingConfig = null;
        let autoSaveInterval = null;
        let quickSaveBlob = null; 
        let isBooting = false;

        function showNotification(text) {
            const el = document.getElementById('notification');
            el.innerText = text;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 2000);
        }

        window.addEventListener("gamepadconnected", (e) => {
            showNotification("GAMEPAD CONNECTED");
            pollGamepad();
        });

        // --- GAMEPAD POLLING FOR BOOT ---
        function pollGamepad() {
            if (emulatorInstance || isBooting) return; // Stop polling once game starts

            const gamepads = navigator.getGamepads();
            for (const gp of gamepads) {
                if (!gp) continue;

                // Button 0 is usually 'A' on most controllers (Xbox/PlayStation/Nintendo layouts)
                if (gp.buttons[0].pressed) {
                    const overlay = document.getElementById('start-overlay');
                    if (overlay.style.display === 'flex') {
                        launchEmulator();
                        return; 
                    }
                }
            }
            requestAnimationFrame(pollGamepad);
        }

        // --- KEYBOARD INTERCEPT ---
        window.addEventListener('keydown', async (e) => {
            if (!emulatorInstance) return;

            // Key '1': SAVE STATE
            if (e.key === '1' || e.code === 'Digit1') {
                e.preventDefault(); e.stopPropagation();
                try {
                    const result = await emulatorInstance.saveState();
                    
                    let blob = result;
                    if (result && result.state) {
                        blob = result.state;
                    }

                    if (blob instanceof Blob) {
                        quickSaveBlob = blob;
                        
                        const buffer = await blob.arrayBuffer();
                        window.parent.postMessage({ 
                            command: 'export_state', 
                            romName: pendingConfig.romName,
                            data: buffer 
                        }, '*');

                        console.log("Quick Save Successful");
                        showNotification("STATE SAVED");
                    } else {
                        console.error("Invalid Save State Result:", result);
                        showNotification("SAVE ERROR");
                    }
                } catch(err) { 
                    console.error("Quick Save Failed", err); 
                    showNotification("SAVE ERROR");
                }
            }
            
            // Key '4': LOAD STATE
            if (e.key === '4' || e.code === 'Digit4') {
                e.preventDefault(); e.stopPropagation();
                if (quickSaveBlob) {
                    try {
                        await emulatorInstance.loadState(quickSaveBlob);
                        console.log("Quick Load Successful");
                        showNotification("STATE LOADED");
                    } catch(err) { 
                        console.error("Quick Load Failed", err);
                        showNotification("LOAD ERROR");
                    }
                } else {
                    showNotification("NO STATE FOUND");
                }
            }
        }, true); 

        // Force focus
        document.addEventListener('click', () => {
            window.focus();
            const canvas = document.querySelector('canvas');
            if(canvas) canvas.focus();
        });

        async function launchEmulator() {
            if (!pendingConfig || isBooting) return;
            isBooting = true;

            const container = document.getElementById('emulator-container');
            const overlay = document.getElementById('start-overlay');
            
            try {
                if (window.emulatorAudioContext && window.emulatorAudioContext.state === 'suspended') {
                    await window.emulatorAudioContext.resume();
                } else if (window.AudioContext) {
                    new window.AudioContext().resume();
                }

                overlay.style.display = 'none';
                container.innerHTML = '';
                const canvas = document.createElement('canvas');
                canvas.tabIndex = 0; 
                container.appendChild(canvas);

                let romToLoad = pendingConfig.romBlob;
                if (pendingConfig.romName) {
                    romToLoad = new File([pendingConfig.romBlob], pendingConfig.romName);
                }

                if (pendingConfig.initialState) {
                    quickSaveBlob = pendingConfig.initialState;
                    console.log("Restored previous save state from disk");
                }

                const launchOptions = {
                    element: canvas, 
                    rom: romToLoad,
                    core: 'fceumm',
                    resolveCoreJs(core) { return `Emulators/nes/${core}_libretro.js`; },
                    resolveCoreWasm(core) { return `Emulators/nes/${core}_libretro.wasm`; },
                    retroarchConfig: pendingConfig.retroarchConfig,
                    style: { width: '100%', height: '100%', display: 'block' }
                };

                if (pendingConfig.saveData) {
                    launchOptions.sram = pendingConfig.saveData; 
                }

                emulatorInstance = await Nostalgist.launch(launchOptions);
                canvas.focus();
                
                if (autoSaveInterval) clearInterval(autoSaveInterval);
                autoSaveInterval = setInterval(async () => {
                    if (!emulatorInstance) return;
                    try {
                        let saveBlob = null;
                        if (typeof emulatorInstance.saveSRAM === 'function') {
                            saveBlob = await emulatorInstance.saveSRAM();
                        }

                        if (saveBlob) {
                            const buffer = await saveBlob.arrayBuffer();
                            window.parent.postMessage({ 
                                command: 'export_save', 
                                romName: pendingConfig.romName,
                                data: buffer 
                            }, '*');
                        }
                    } catch (e) {}
                }, 10000);

            } catch (e) { 
                console.error("Launch Error:", e);
                isBooting = false;
                window.parent.postMessage({ status: 'error', message: e.toString() }, '*'); 
            }
        }

        window.addEventListener('message', async (event) => {
            const { command } = event.data;
            if (command === 'start') {
                pendingConfig = event.data;
                document.getElementById('start-overlay').style.display = 'flex';
                // Start checking for gamepad input as soon as the start command is received
                pollGamepad();
            } 
            else if (command === 'mute') {
                const ctx = window.emulatorAudioContext;
                if (ctx && ctx._masterGain) {
                    const isMuted = ctx._masterGain.gain.value < 0.01;
                    ctx._masterGain.gain.setTargetAtTime(isMuted ? 1.0 : 0.0, ctx.currentTime, 0.1);
                }
            }
        });

        document.getElementById('start-btn').addEventListener('click', launchEmulator);
    </script>
</body>
</html>
