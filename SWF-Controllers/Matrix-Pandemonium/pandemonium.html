<!DOCTYPE html>
<html>
<head>
    <style>
        /* Reset all margins and force full viewport size */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            background-color: #000; 
        }
        
        /* Force container to fill the window */
        #ruffle-container { 
            width: 100vw; 
            height: 100vh; 
            display: block;
        }
        
        /* Force the Ruffle element (custom tag) to fill the container */
        ruffle-player {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div id="ruffle-container"></div>
    <script src="../Ruffle/ruffle.js"></script>
    <script src="pandemonium_launcher.js"></script>
</body>
</html>
