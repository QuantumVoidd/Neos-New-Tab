<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: black; overflow: hidden;
            display: flex; flex-direction: column; 
        }
        #emulator-container { 
            width: 100% !important; height: 100% !important; 
            flex-grow: 1; display: flex; justify-content: center; align-items: center; 
        }
        canvas { 
            display: block; width: 100% !important; height: 100% !important; 
            image-rendering: pixelated; outline: none;
        }

        #notification {
            position: absolute;
            top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); border: 1px solid #0f0; color: #0f0;
            padding: 10px 20px; font-family: 'Courier New', monospace; font-weight: bold;
            font-size: 16px; border-radius: 5px; display: none; z-index: 1000; pointer-events: none;
        }

        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('Emulators/snes/cover.jpg') center/cover no-repeat;
            display: flex; flex-direction: column; justify-content: flex-end; 
            align-items: center; box-sizing: border-box; padding-bottom: 50px; 
            z-index: 100; display: none; 
        }
        #start-btn {
            background: rgba(0, 0, 0, 0.6); border: 2px solid #00ff41; color: #00ff41;
            padding: 15px 40px; font-size: 1.5rem; cursor: pointer; font-family: inherit;
            text-transform: uppercase; box-shadow: 0 0 15px #00ff41; transition: all 0.2s;
            backdrop-filter: blur(4px); border-radius: 50px; 
        }
        #start-btn:hover { background: #00ff41; color: black; box-shadow: 0 0 30px #00ff41; }
    </style>
</head>
<body>
    <div id="notification"></div>
    <div id="emulator-container"></div>
    
    <div id="start-overlay"><button id="start-btn">BOOT SYSTEM</button></div>

    <script>
        (function() {
            const originalConnect = AudioNode.prototype.connect;
            AudioNode.prototype.connect = function(destination, output, input) {
                if (destination && destination instanceof AudioDestinationNode) {
                    const ctx = destination.context;
                    if (!ctx._masterGain) {
                        ctx._masterGain = ctx.createGain();
                        ctx._masterGain.gain.value = 1.0; 
                        originalConnect.call(ctx._masterGain, destination);
                        window.emulatorAudioContext = ctx;
                    }
                    return originalConnect.call(this, ctx._masterGain, output, input);
                }
                return originalConnect.apply(this, arguments);
            };
        })();
    </script>

    <script src="Emulators/genesis/nostalgist.umd.min.js"></script>

    <script>
        let emulatorInstance = null;
        let gamepadLoop = null;
        let pendingConfig = null; 
        let currentSaveBlob = null; 
        let currentSlot = 1; 

        let notifyTimeout = null;
        function showNotification(text, keepAlive = false) {
            const el = document.getElementById('notification');
            if(el) {
                el.innerText = text;
                el.style.display = 'block';
                if (notifyTimeout) clearTimeout(notifyTimeout);
                if (!keepAlive) {
                    notifyTimeout = setTimeout(() => { el.style.display = 'none'; }, 2000);
                }
            }
        }

        function pollGamepads() {
            gamepadLoop = requestAnimationFrame(pollGamepads);
            navigator.getGamepads();
        }

        // The ultimate arbiter of file completion. Waits dynamically until the file completely stops writing.
        async function waitForAnyStableStateFile(FS, dir) {
            let lastSize = 0;
            let steadyCount = 0;
            let targetName = null;
            
            for (let i = 0; i < 300; i++) { // Increased to 30 seconds buffer for slow devices
                await new Promise(r => setTimeout(r, 100));
                try {
                    const files = FS.readdir(dir);
                    targetName = files.find(f => f.endsWith('.state') && f !== '.' && f !== '..');
                    
                    if (targetName) {
                        const stat = FS.stat(`${dir}/${targetName}`);
                        if (stat.size > 1000) { 
                            if (stat.size === lastSize) {
                                steadyCount++;
                                if (steadyCount >= 15) { // Needs to be totally stable for 1.5 seconds to outlast SRAM flushes
                                    return {
                                        name: targetName,
                                        data: FS.readFile(`${dir}/${targetName}`)
                                    };
                                }
                            } else {
                                lastSize = stat.size;
                                steadyCount = 0;
                            }
                        }
                    }
                } catch(e) {}
            }
            throw new Error("Timeout waiting for core to finish writing file.");
        }

        window.addEventListener('keydown', async (e) => {
            if (!emulatorInstance) return;

            // --- SAVE STATE (Key '1') ---
            if (e.key === '1' || e.code === 'Digit1') {
                e.preventDefault(); e.stopPropagation();
                
                try {
                    showNotification(`SAVING SLOT ${currentSlot}...`);
                    const FS = emulatorInstance.getEmscriptenFS();
                    const statesDir = '/home/web_user/retroarch/userdata/states';

                    // 1. Wipe directory to guarantee we only read the new file
                    try { FS.readdir(statesDir).forEach(f => { if (f.endsWith('.state')) FS.unlink(`${statesDir}/${f}`); }); } catch(e){}

                    // 2. Trigger core to save
                    emulatorInstance.saveState().catch(()=>{});

                    // 3. Wait for it to securely finish
                    const stableFile = await waitForAnyStableStateFile(FS, statesDir);
                    
                    // Cache the confirmed name to use for loading later in the session
                    window._snesActualSaveName = stableFile.name; 
                    
                    currentSaveBlob = new Blob([stableFile.data]);
                    const buffer = await currentSaveBlob.arrayBuffer();
                    
                    window.parent.postMessage({ 
                        command: 'export_state', 
                        slot: currentSlot,
                        romName: pendingConfig.romName, 
                        data: buffer 
                    }, '*');
                    
                    showNotification(`SAVED SLOT ${currentSlot}`);
                    console.log(`[SNES] Exported ${Math.round(currentSaveBlob.size/1024)}KB to Slot ${currentSlot}`);

                } catch(err) { 
                    console.error("Save Error:", err);
                    showNotification("SAVE ERROR"); 
                }
            }

            // --- LOAD STATE (Key '4') ---
            if (e.key === '4' || e.code === 'Digit4') {
                e.preventDefault(); e.stopPropagation();
                
                if (currentSaveBlob) {
                    try {
                        const FS = emulatorInstance.getEmscriptenFS();
                        const statesDir = '/home/web_user/retroarch/userdata/states';
                        
                        // ON-DEMAND SYNCHRONIZATION
                        if (!window._snesActualSaveName) {
                            showNotification("SYNCING CORE... PLEASE WAIT", true);
                            
                            // Clear directory
                            try { FS.readdir(statesDir).forEach(f => { if (f.endsWith('.state')) FS.unlink(`${statesDir}/${f}`); }); } catch(e){}
                            
                            // Trigger a dummy save solely to discover the name
                            emulatorInstance.saveState().catch(()=>{});
                            
                            // Wait for the dummy save to completely finish writing
                            const dummyFile = await waitForAnyStableStateFile(FS, statesDir);
                            window._snesActualSaveName = dummyFile.name;
                            console.log(`[SNES] Core signature locked: ${window._snesActualSaveName}`);
                            
                            // CLEAN BREAK: Stop execution to let the core catch its breath.
                            showNotification("SYNC COMPLETE! PRESS 4 AGAIN");
                            return; 
                        }

                        showNotification(`LOADING SLOT ${currentSlot}...`);

                        // 1. Wipe directory to clean out the dummy save or any old states
                        try { FS.readdir(statesDir).forEach(f => { if (f.endsWith('.state')) FS.unlink(`${statesDir}/${f}`); }); } catch(e){}

                        // 2. Safely Inject our verified Save Data
                        const buffer = await currentSaveBlob.arrayBuffer();
                        const stateData = new Uint8Array(buffer);
                        
                        const blanketNames = [
                            window._snesActualSaveName,
                            'game.state',
                            'game.sfc.state'
                        ];

                        blanketNames.forEach(name => {
                            try { FS.writeFile(`${statesDir}/${name}`, stateData); } catch(e){}
                        });

                        // 3. Trigger Core Load
                        await emulatorInstance.loadState(currentSaveBlob).catch(()=>{});
                        
                        // 4. Visually sync the notification with the WASM frame rendering delay
                        setTimeout(() => {
                            showNotification("STATE LOADED");
                        }, 750);
                        
                    } catch(err) { 
                        console.error("Load Exception:", err);
                        showNotification("LOAD ERROR"); 
                    }
                } else { 
                    showNotification(`SLOT ${currentSlot} EMPTY`); 
                }
            }
        }, true);

        async function launchEmulator() {
            if (!pendingConfig) return;
            const container = document.getElementById('emulator-container');
            const overlay = document.getElementById('start-overlay');

            try {
                if (window.emulatorAudioContext && window.emulatorAudioContext.state === 'suspended') {
                    await window.emulatorAudioContext.resume();
                } else if (window.AudioContext) {
                    new window.AudioContext().resume();
                }

                overlay.style.display = 'none';
                container.innerHTML = '';
                const canvas = document.createElement('canvas');
                canvas.tabIndex = 0; 
                container.appendChild(canvas);
                canvas.focus();

                if (pendingConfig.initialState) {
                    currentSaveBlob = (pendingConfig.initialState instanceof Blob) 
                        ? pendingConfig.initialState 
                        : new Blob([pendingConfig.initialState]);
                }
                if (pendingConfig.initialSlot) currentSlot = pendingConfig.initialSlot;

                // Forcing Nostalgist's internal tracking to a standardized simple name
                const safeRomFile = new File([pendingConfig.romBlob], "game.sfc", { type: "application/octet-stream" });

                emulatorInstance = await Nostalgist.launch({
                    element: canvas, 
                    rom: safeRomFile,
                    core: pendingConfig.coreConfig,
                    retroarchConfig: pendingConfig.retroarchConfig,
                    style: { width: '100%', height: '100%', display: 'block' }
                });
                
                window.focus();
                canvas.focus();
                window.parent.postMessage({ status: 'running' }, '*');
                
                if (!gamepadLoop) pollGamepads();

            } catch (e) {
                console.error("Sandbox Error:", e);
                window.parent.postMessage({ status: 'error', message: e.toString() }, '*');
            }
        }

        window.addEventListener('message', (event) => {
            const { command } = event.data;

            if (command === 'start') {
                pendingConfig = event.data;
                document.getElementById('start-overlay').style.display = 'flex';
            }
            else if (command === 'import_slot' || command === 'import_state') {
                if (event.data.slot !== undefined) currentSlot = event.data.slot;
                if (event.data.blob || event.data.data) {
                    currentSaveBlob = new Blob([event.data.blob || event.data.data]);
                    showNotification(`SLOT ${currentSlot} READY`);
                } else {
                    currentSaveBlob = null;
                    showNotification(`SLOT ${currentSlot} EMPTY`);
                }
            }
            else if (command === 'mute') {
                const ctx = window.emulatorAudioContext;
                if (ctx && ctx._masterGain) {
                    const isMuted = ctx._masterGain.gain.value < 0.01;
                    ctx._masterGain.gain.setTargetAtTime(isMuted ? 1.0 : 0.0, ctx.currentTime, 0.1);
                }
            }
        });

        window.addEventListener('click', () => {
             const canvas = document.querySelector('canvas');
             if(canvas) canvas.focus();
        });

        window.addEventListener("gamepadconnected", (e) => {
            showNotification("GAMEPAD CONNECTED");
            window.parent.postMessage({ status: 'gamepad_connected', id: e.gamepad.id }, '*');
        });

        document.getElementById('start-btn').addEventListener('click', launchEmulator);
    </script>
</body>
</html>
